<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Toki Marketplace</title>
    <link href="img/logo.png" rel="icon" type="image/png" sizes="16x16">
    <link href="css/animate.min.css" rel="stylesheet"/>
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/main.css" rel="stylesheet">
    <link href="css/media.css" rel="stylesheet">
    <link href="css/style-en.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        body {
            background-color: #f4f5f7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .auth-container {
            max-width: 520px;
            width: 92%;
            margin: 35px auto;
            background: #ffffff;
            border-radius: 16px;
            padding: 36px 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
            border: 1px solid #ebebeb;
        }
        .auth-header {
            text-align: center;
            margin-bottom: 25px;
        }
        .auth-header .auth-logo {
            max-width: 140px;
            margin-bottom: 18px;
        }
        .auth-header h2 {
            font-size: 24px;
            font-weight: 700;
            color: #222;
            margin-bottom: 8px;
        }
        .auth-header p {
            color: #777;
            font-size: 14px;
            margin-bottom: 0;
        }
        .auth-tabs {
            display: flex;
            background: #f0f1f4;
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 25px;
        }
        .auth-tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            font-size: 14px;
            font-weight: 600;
            color: #666;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .auth-tab-btn.active {
            background: #ffffff;
            color: #fa5000;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }
        .form-group-custom {
            margin-bottom: 18px;
            position: relative;
        }
        .form-group-custom label {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 7px;
            display: block;
        }
        .input-icon-wrap {
            position: relative;
        }
        .input-icon-wrap i.field-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
            font-size: 16px;
        }
        .input-icon-wrap .toggle-password {
            position: absolute;
            right: 15px;
            left: auto;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
            cursor: pointer;
            font-size: 15px;
        }
        .input-icon-wrap input {
            width: 100%;
            height: 46px;
            padding: 0 45px 0 45px;
            border: 1.5px solid #e2e4e8;
            border-radius: 10px;
            font-size: 14px;
            transition: border-color 0.2s;
            outline: none;
        }
        .input-icon-wrap input:focus {
            border-color: #fa5000;
            box-shadow: 0 0 0 3px rgba(250, 80, 0, 0.12);
        }
        .btn-auth-submit {
            width: 100%;
            height: 48px;
            background: linear-gradient(135deg, #ff6a00 0%, #fa5000 100%);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 14px rgba(250, 80, 0, 0.3);
            margin-top: 10px;
        }
        .btn-auth-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(250, 80, 0, 0.4);
        }
        .auth-footer-text {
            text-align: center;
            font-size: 14px;
            color: #666;
            margin-top: 20px;
        }
        .auth-footer-text a {
            color: #fa5000;
            font-weight: 700;
            text-decoration: none;
        }
        .terms-text {
            font-size: 12px;
            color: #777;
            margin-top: 12px;
            line-height: 1.6;
        }
        .terms-text a {
            color: #fa5000;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <!-- Simple Top Bar -->
    <div style="background: #fa5000; padding: 12px 0; text-align: center;">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="index_en.html" class="d-flex align-items-center text-white" style="text-decoration: none; font-size: 14px; font-weight: bold;">
                <i class="fa fa-arrow-left mr-2"></i> Back to Store
            </a>
            <a href="index_en.html">
                <img src="img/logo.png" alt="Toki" style="height: 35px; filter: brightness(0) invert(1);">
            </a>
            <a href="signup.html" class="text-white" style="text-decoration: none; font-size: 13px;">
                العربية
            </a>
        </div>
    </div>

    <!-- Main Auth Container -->
    <div class="container">
        <div class="auth-container">
            <div class="auth-header">
                <a href="index_en.html">
                    <img src="img/logo.png" alt="Toki Store" class="auth-logo">
                </a>
                <h2>Create an Account</h2>
                <p>Join Toki Marketplace to discover exclusive deals</p>
            </div>

            <!-- Role Tabs -->
            <div class="auth-tabs">
                <button type="button" class="auth-tab-btn active" onclick="setRole('customer', this)">Customer</button>
                <button type="button" class="auth-tab-btn" onclick="setRole('vendor', this)">Vendor</button>
                <button type="button" class="auth-tab-btn" onclick="setRole('courier', this)">Courier</button>
            </div>

            <!-- Register Form -->
            <form id="signupForm" onsubmit="handleSignup(event)">
                <div class="form-group-custom">
                    <label>Full Name</label>
                    <div class="input-icon-wrap">
                        <i class="fa-regular fa-user field-icon"></i>
                        <input type="text" id="regName" placeholder="e.g. Abdullah Mohammed" required>
                    </div>
                </div>

                <div class="form-group-custom">
                    <label>Email Address</label>
                    <div class="input-icon-wrap">
                        <i class="fa-regular fa-envelope field-icon"></i>
                        <input type="email" id="regEmail" placeholder="name@example.com" required>
                    </div>
                </div>

                <div class="form-group-custom">
                    <label>Phone Number</label>
                    <div class="input-icon-wrap">
                        <i class="fa-solid fa-phone field-icon"></i>
                        <input type="tel" id="regPhone" placeholder="+966 5..." required>
                    </div>
                </div>

                <div class="form-group-custom">
                    <label>Password</label>
                    <div class="input-icon-wrap">
                        <i class="fa-solid fa-lock field-icon"></i>
                        <input type="password" id="regPassword" placeholder="Minimum 8 characters" required minlength="6">
                        <i class="fa-regular fa-eye toggle-password" onclick="togglePass('regPassword', this)"></i>
                    </div>
                </div>

                <div class="terms-text">
                    <label style="cursor: pointer; display: flex; align-items: flex-start; gap: 8px; margin: 0;">
                        <input type="checkbox" required checked style="margin-top: 4px;">
                        <span>I agree to Toki's <a href="#">Terms of Use</a> and <a href="#">Privacy Policy</a></span>
                    </label>
                </div>

                <button type="submit" class="btn-auth-submit" id="submitBtn">
                    Create Account <i class="fa-solid fa-user-plus ml-2"></i>
                </button>
            </form>

            <div class="auth-footer-text">
                Already have an account? <a href="login_en.html">Sign In</a>
            </div>
        </div>
    </div>

    <!-- Simple Footer -->
    <div style="background: #fff; border-top: 1px solid #eee; padding: 18px 0; text-align: center; font-size: 13px; color: #888;">
        All Rights Reserved © Toki Marketplace 2026
    </div>

    <script src="js/jquery-3.2.1.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script>
        let currentRole = 'customer';

        function setRole(role, btn) {
            currentRole = role;
            $('.auth-tab-btn').removeClass('active');
            $(btn).addClass('active');
        }

        function togglePass(inputId, icon) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                $(icon).removeClass('fa-eye').addClass('fa-eye-slash');
            } else {
                input.type = 'password';
                $(icon).removeClass('fa-eye-slash').addClass('fa-eye');
            }
        }

        function handleSignup(e) {
            e.preventDefault();
            const name = document.getElementById('regName').value.trim() || 'Toki User';
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Creating account...';
            btn.disabled = true;

            setTimeout(() => {
                const user = {
                    name: name,
                    email: document.getElementById('regEmail').value.trim(),
                    phone: document.getElementById('regPhone').value.trim(),
                    role: currentRole,
                    loggedIn: true,
                    loginTime: new Date().toISOString()
                };
                localStorage.setItem('toki_user', JSON.stringify(user));
                window.location.href = 'index_en.html';
            }, 600);
        }
    </script>
</body>
</html>
